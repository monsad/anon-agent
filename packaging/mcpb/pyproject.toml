[project]
name = "anon-agent"
version = "0.2.0"
description = "AnonAgent — serwer MCP do pseudonimizacji dokumentów"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=2.3",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "pypdf>=5",
    "spacy>=3.8,<3.9",
    "pl_core_news_md @ https://github.com/explosion/spacy-models/releases/download/pl_core_news_md-3.8.0/pl_core_news_md-3.8.0-py3-none-any.whl",
]
